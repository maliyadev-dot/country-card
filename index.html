<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Country Card</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <section class="country-card">
            <img
                src="https://flagcdn.com/w320/se.png"
                alt="Flag of Sweden"
                class="country-flag"
            />
            <h1>Sweden</h1>
            <p><strong>Capital:</strong> Stockholm</p>
            <p><strong>Region:</strong> Europe</p>
            <p><strong>Population:</strong> 10.7 million</p>
            <p><strong>Currency:</strong> Swedish krona (SEK)</p>
        </section>
    </body>
</html>
